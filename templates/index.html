<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Pengaturan Karakter Set dan Viewport untuk Responsivitas -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RenAI - AI Aggregator</title>
    
    <!-- Tailwind CSS Engine (v4 Browser Bundle) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
    
    <style>
        /* Mengembalikan gaya dasar Markdown & Menghilangkan gap bawah berlebih */
        .markdown-content { white-space: normal !important; }
        .markdown-content p { margin-top: 0 !important; margin-bottom: 0.5em !important; display: block !important; }
        .markdown-content p:last-child { margin-bottom: 0 !important; }
        .markdown-content h1 { font-size: 2em !important; font-weight: 700 !important; margin: 0.5em 0 !important; display: block !important; }
        .markdown-content h2 { font-size: 1.5em !important; font-weight: 700 !important; margin: 0.5em 0 !important; display: block !important; }
        .markdown-content h3 { font-size: 1.25em !important; font-weight: 700 !important; margin: 0.5em 0 !important; display: block !important; }
        .markdown-content ul { list-style-type: disc !important; margin-left: 1.5em !important; margin-bottom: 0.5em !important; display: block !important; }
        .markdown-content ol { list-style-type: decimal !important; margin-left: 1.5em !important; margin-bottom: 0.5em !important; display: block !important; }
        .markdown-content li { margin-bottom: 0.25em !important; }
        .markdown-content strong { font-weight: 700 !important; }
        .markdown-content a { color: #3b82f6 !important; text-decoration: underline !important; }
        .markdown-content pre { background-color: #111827 !important; padding: 1em !important; border-radius: 8px !important; overflow-x: auto !important; margin-bottom: 0.5em !important; }
        .markdown-content code { background-color: #374151 !important; padding: 2px 4px !important; border-radius: 4px !important; font-family: monospace !important; font-size: 0.9em !important; }
        .markdown-content pre code { background-color: transparent !important; padding: 0 !important; }

        /* Custom Styling Scrollbar untuk Tema Gelap */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #212121; }
        ::-webkit-scrollbar-thumb { background: #424242; border-radius: 3px; }
    
        /* Animasi Pulsa untuk Indikator Status "Berpikir..." */
        @keyframes pulse-light {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        .thinking-pulse {
            animation: pulse-light 1.4s infinite ease-in-out;
        }

        /* ===== Sidebar Responsif =====
           Mobile  : overlay (position fixed) menutupi konten, dengan backdrop.
           Desktop : bagian dari flex layout (position relative/static) sehingga
                     saat terbuka ia MENDORONG main content, bukan menimpanya.
           Logo tinggal permanen di dalam sidebar, jadi tidak ada lagi
           tabrakan/tumpang-tindih antara header, logo, dan sidebar. */
        #sidebar {
            transition: width 0.3s ease, transform 0.3s ease;
        }
        /* Inner wrapper diberi lebar tetap supaya konten (teks, tombol) tidak
           ikut menyempit/reflow aneh selagi sidebar sedang animasi lebar. */
        #sidebarInner {
            width: 260px;
        }

        @media (max-width: 767px) {
            #sidebar {
                position: fixed;
                inset-block: 0;
                left: 0;
                width: 260px;
                max-width: 85vw;
                transform: translateX(-100%);
                z-index: 40;
            }
            #sidebar.sidebar-open {
                transform: translateX(0);
            }
        }

        @media (min-width: 768px) {
            #sidebar {
                position: relative;
                width: 0;
                overflow: hidden;
            }
            #sidebar.sidebar-open {
                width: 260px;
            }
            /* Backdrop hanya relevan untuk mode overlay di mobile */
            #sidebarOverlay {
                display: none;
            }
        }
    </style>
</head>
<body class="bg-[#212121] text-gray-200 font-sans h-screen flex overflow-hidden m-0 p-0">

    <!-- Backdrop: menggelapkan area chat saat sidebar terbuka, klik untuk menutup -->
    <div id="sidebarOverlay" onclick="closeSidebar()" class="fixed inset-0 bg-black/50 z-30 opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <!-- Sidebar Komponen: Menampilkan tombol Chat Baru & Riwayat Chat -->
    <!-- position: fixed -> sidebar overlay di atas konten, TIDAK ikut mengecilkan main/chat area -->
    <aside id="sidebar" class="bg-[#171717] h-full border-r border-gray-800 shrink-0 z-40">
        <div id="sidebarInner" class="h-full flex flex-col justify-between">
            <div class="flex flex-col">
                <!-- Header Sidebar: Logo + Tombol Tutup (panah kiri) -->
                <div class="flex items-center justify-between p-4 border-b border-gray-800">
                    <div class="text-lg font-semibold text-gray-200">RenAI</div>
                    <button onclick="closeSidebar()" aria-label="Tutup menu" class="p-2 rounded-lg hover:bg-[#2f2f2f] text-gray-300 transition cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
                        </svg>
                    </button>
                </div>

                <div class="flex flex-col gap-2 p-3">
                    <!-- Tombol untuk mereset/memulai chat baru -->
                    <button onclick="window.location.reload()" class="w-full text-left p-3 hover:bg-[#212121] rounded-lg border border-gray-700 flex items-center justify-between text-sm transition font-medium cursor-pointer">
                        <span>Chat Baru</span>
                    </button>

                    <!-- Daftar Riwayat Percakapan -->
                    <div class="text-xs text-gray-500 px-3 mt-4 uppercase font-bold tracking-wider">Riwayat Chat</div>
                    <div class="text-sm text-gray-400 px-3 py-2 hover:bg-[#212121] rounded-md cursor-pointer truncate">
                        First chat
                    </div>
                </div>
            </div>

            <!-- Footer Sidebar -->
            <div class="p-5 text-xs text-gray-500 border-t border-gray-800">
                More inprogress
            </div>
        </div>
    </aside>

    <!-- Area Utama Aplikasi (Header, Chat Stream, Welcome Screen, dan Input Box) -->
    <main class="flex-1 flex flex-col relative h-full w-full justify-between items-center bg-[#212121] overflow-hidden">
        
        <!-- Header Atas dengan Tombol Hamburger & Logo / Judul Aplikasi -->
        <header class="w-full p-4 flex justify-between items-center absolute top-0 left-0 z-50 pointer-events-none">
            <div class="flex items-center gap-1 pointer-events-auto">
                <!-- Tombol Buka Sidebar (panah kanan): hanya tampil saat sidebar tertutup -->
                <button id="mainToggleBtn" onclick="toggleSidebar()" aria-label="Buka menu" class="p-2 rounded-lg hover:bg-[#2f2f2f] text-gray-300 transition cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5 15.75 12l-7.5 7.5" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Container Percakapan Chat (Disembunyikan pada awal dimuat) -->
        <div id="chatArea" class="w-full max-w-3xl flex-1 overflow-y-auto px-3 sm:px-4 pt-20 pb-48 space-y-6 hidden mx-auto transition-opacity duration-500 opacity-0">
        </div>

        <!-- Tampilan Pesan Selamat Datang (Awal sebelum ada percakapan) -->
        <div id="welcomeScreen" class="flex flex-col items-center justify-center flex-1 max-w-xl text-center px-4 mx-auto my-auto transition-all duration-500 opacity-100 transform scale-100">
            <h1 class="text-2xl sm:text-4xl font-bold text-gray-100 mb-2">Mau bantu apa hari ini?</h1>
            <p class="text-gray-400 text-sm">Pilih model andalanmu di kiri bawah dan mulailah mengetik.</p>
        </div>

        <!-- Container Input Pesan & Pemilihan Model AI -->
        <div class="w-full max-w-3xl px-3 sm:px-4 absolute bottom-0 pb-6 bg-gradient-to-t from-[#212121] via-[#212121] to-transparent pt-10 mx-auto left-0 right-0 z-20">
            <div class="bg-[#2f2f2f] rounded-2xl p-3 border border-gray-700 shadow-2xl flex flex-col gap-2">
                
                <!-- Textarea untuk Mengetik Pesan -->
                <textarea 
                    id="userInput" 
                    placeholder="Tanya Groq sesuatu..." 
                    class="w-full bg-transparent resize-none outline-none text-gray-100 placeholder-gray-500 text-base px-2 py-1 max-h-32 min-h-[24px]"
                    onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>

                <!-- Panel Kontrol Bawah Textarea: Dropdown Model & Tombol Kirim -->
                <div class="flex justify-between items-center pt-2 border-t border-gray-800">
                    <div class="flex items-center gap-2">
                        <!-- Dropdown Pilihan Model -->
                        <select id="modelSelect" class="bg-[#212121] text-xs text-gray-400 border border-gray-700 rounded-lg px-3 py-1.5 outline-none cursor-pointer hover:bg-[#2d2d2d] transition">
                            {% for model in models %}
                                <option value="{{ model.id }}">{{ model.display_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Tombol Kirim Pesan -->
                    <button onclick="sendMessage()" class="bg-white hover:bg-gray-200 text-black font-bold p-2 rounded-full transition shadow flex items-center justify-center w-8 h-8 cursor-pointer">
                        <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-4 h-4">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18" />
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Disclaimer Penggunaan AI -->
            <div class="text-[10px] text-gray-500 text-center mt-2">
                AI dapat membuat kesalahan. Pertimbangkan untuk memeriksa informasi penting.
            </div>
        </div>

    </main>

    <!-- Script Logika Frontend -->
    <script>
        let isFirstChat = true;

        // Sidebar berupa overlay (position: fixed), jadi buka/tutup hanya
        // menggeser transform + menampilkan backdrop — tidak pernah mengubah
        // ukuran/lebar main content, sehingga chat area tidak ikut mengecil.
        function openSidebar() {
            document.getElementById('sidebar').classList.add('sidebar-open');
            // Sembunyikan tombol panah-kanan di header utama; tombol panah-kiri
            // di dalam sidebar sendiri yang mengambil alih fungsi menutup.
            document.getElementById('mainToggleBtn').classList.add('hidden');
            const overlay = document.getElementById('sidebarOverlay');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('sidebar-open');
            document.getElementById('mainToggleBtn').classList.remove('hidden');
            const overlay = document.getElementById('sidebarOverlay');
            overlay.classList.add('opacity-0', 'pointer-events-none');
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('sidebar-open')) {
                closeSidebar();
            } else {
                openSidebar();
            }
        }

        async function sendMessage() {
            const messageInput = document.getElementById('userInput');
            const message = messageInput.value;
            const modelId = document.getElementById('modelSelect').value;
            const chatArea = document.getElementById('chatArea');
            const welcomeScreen = document.getElementById('welcomeScreen');

            if (!message.trim()) return;

            if (isFirstChat) {
                welcomeScreen.classList.add('opacity-0', 'scale-95');
                
                setTimeout(() => {
                    welcomeScreen.classList.add('hidden');
                    welcomeScreen.classList.remove('flex');
                    
                    chatArea.classList.remove('hidden');
                    setTimeout(() => chatArea.classList.add('opacity-100'), 50);
                }, 400);

                openSidebar();
                
                isFirstChat = false;
            }

            appendMessage('user', message);
            
            // --- KUNCI UTAMA: KOSONGKAN LALU RESET TINGGI SECARA REFLOW-SAFE ---
            messageInput.value = "";
            resetTextareaHeight(messageInput);
            
            const botMessageId = appendMessage('bot', 'Berpikir...');
            const botZone = document.getElementById(botMessageId);
            botZone.classList.add('thinking-pulse', 'text-gray-400', 'italic');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, model_id: modelId })
                });

                botZone.classList.remove('thinking-pulse', 'text-gray-400', 'italic');
                
                const data = await response.json();
                
                if (data.success) {
                    typeWriter(botZone, data.reply, chatArea);
                } else {
                    botZone.innerText = "Error dari Server: " + data.error;
                    botZone.classList.add('text-red-400');
                }
            } catch (err) {
                botZone.classList.remove('thinking-pulse', 'text-gray-400', 'italic');
                botZone.innerText = "Gagal mengambil data dari server lokal. Pastikan main.py terhubung.";
                botZone.classList.add('text-red-400');
                console.error(err);
            }

            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function typeWriter(element, text, scrollContainer) {
            let i = 0;
            let rawText = "";
            element.innerHTML = ""; 
            
            const speed = 10; 
            
            function type() {
                if (i < text.length) {
                    rawText += text.charAt(i);
                    element.innerHTML = readMarkdown(rawText); 
                    i++;
                    scrollContainer.scrollTop = scrollContainer.scrollHeight;
                    setTimeout(type, speed);
                } else {
                    element.innerHTML = readMarkdown(text);
                    scrollContainer.scrollTop = scrollContainer.scrollHeight;
                }
            }
            type();
        }

        // Konfigurasi Marked agar mendeteksi baris baru dengan benar
        marked.setOptions({
            gfm: true,
            breaks: true
        });

        function readMarkdown(text) {
            try {
                if (typeof marked === 'undefined') return text; 
                const html = marked.parse(text);
                return typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(html) : html;
            } catch (err) {
                console.error("Error parse markdown:", err);
                return text;
            }
        }

        function appendMessage(sender, text) {
            const chatArea = document.getElementById('chatArea');
            const msgId = 'msg-' + Date.now();
            
            const msgRow = document.createElement('div');
            msgRow.className = `flex w-full ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const msgBubble = document.createElement('div');
            if (sender === 'user') {
                msgBubble.className = "markdown-content bg-[#2f2f2f] text-gray-100 max-w-[88%] sm:max-w-[70%] rounded-2xl px-4 py-2.5 text-base border border-gray-700 shadow-sm transition-all duration-300 transform translate-y-2 opacity-0";
                msgBubble.innerHTML = readMarkdown(text);

                setTimeout(() => {
                    msgBubble.classList.remove('translate-y-2', 'opacity-0');
                }, 20);
            } else {
                msgBubble.className = "markdown-content text-gray-200 max-w-[92%] sm:max-w-[85%] text-base leading-relaxed";
                msgBubble.id = msgId;
                msgBubble.innerHTML = readMarkdown(text);
            }
            
            msgRow.appendChild(msgBubble);
            chatArea.appendChild(msgRow);
            
            chatArea.scrollTop = chatArea.scrollHeight;
            return msgId;
        }

        const tx = document.getElementById('userInput');
        tx.addEventListener("input", OnInput, false);

        // Fungsi bersama untuk resize textarea. Membaca offsetHeight di antara
        // perubahan style memaksa browser melakukan reflow sinkron, jadi
        // perubahan height benar-benar diterapkan saat itu juga (bukan
        // di-batch/di-skip saat banyak manipulasi DOM lain terjadi di tick yang sama).
        function resetTextareaHeight(el) {
            el.style.height = "auto";
            void el.offsetHeight; // paksa reflow
            if (el.value.trim() === "") {
                el.style.height = "28px";
            } else {
                el.style.height = el.scrollHeight + "px";
            }
        }

        function OnInput() {
            resetTextareaHeight(this);
        }
    </script>
</body>
</html>
